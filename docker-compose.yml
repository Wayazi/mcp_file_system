version: '3.8'

services:
  mcp-filesystem:
    build: .
    volumes:
      - ${PROJECTS_DIR:-./data}:/projects
    environment:
      - NODE_ENV=production
    # Remove ports since this is a stdio-based MCP server, not HTTP
    healthcheck:
      test: ["/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s