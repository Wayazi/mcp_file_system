version: '3.8'

services:
  mcp-filesystem:
    build: .
    volumes:
      - ${PROJECTS_DIR:-./data}:/projects
    environment:
      - NODE_ENV=production
    # Remove ports since this is a stdio-based MCP server, not HTTP
    healthcheck:
      test: ["CMD", "node", "-e", "try { require('./dist/index.js'); console.log('MCP server binary is ready'); process.exit(0); } catch(e) { console.error('Health check failed:', e.message); process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s